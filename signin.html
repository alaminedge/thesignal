<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Pacific Signal — Sign In</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/images/tps.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;0,8..60,800&display=swap" rel="stylesheet">
<script>
(function(){var t=null;try{t=localStorage.getItem('tps-theme')}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
/* Same design tokens as the public site */
:root{
  --bg:#F6F6F4;--card:#FFFFFF;--bg2:#EEEEEA;
  --ink:#121212;--ink2:#2B2B2B;--ink3:#555555;--ink4:#767676;--ink5:#A3A3A3;
  --rule:#E2E2DE;--rule2:#C9C9C4;
  --accent:#A4161A;--accent2:#7F1013;--acc-rgb:164,22,26;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#101010;--card:#181818;--bg2:#1F1F1F;
  --ink:#F2F2EF;--ink2:#DADAD6;--ink3:#ABABA6;--ink4:#85857F;--ink5:#5F5F5A;
  --rule:#2A2A28;--rule2:#3A3A37;
  --accent:#E5575B;--accent2:#F08285;--acc-rgb:229,87,91;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html[data-theme="dark"]{color-scheme:dark}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{width:100%;max-width:410px;background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink)}
.card-top-rule{display:none}
.card-body{padding:36px 34px 30px}
.card-logo{text-align:center;margin-bottom:22px}
.logo-img-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.logo-img-wrap img{height:42px;width:auto}
[data-theme="dark"] .logo-img-wrap img{filter:brightness(0) invert(.95)}
.logo-name{font-family:var(--serif);font-size:1.5rem;font-weight:800;letter-spacing:-.015em;color:var(--ink);line-height:1}
.logo-orn{display:none}
.logo-tag{font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink4);margin-top:8px}
.card-divider{height:1px;background:var(--rule);margin-bottom:20px}
.card-subtitle{font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-align:center;margin-bottom:22px}

.alert{padding:10px 12px;margin-bottom:14px;display:none;font:500 13px/1.4 var(--sans);border-left:3px solid var(--accent);background:rgba(var(--acc-rgb),.08);color:var(--accent)}
.alert.on{display:block}

.fg{margin-bottom:15px}
.flbl{display:block;font:700 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.finp{width:100%;padding:12px 13px;background:var(--card);border:1px solid var(--rule2);border-radius:2px;font:400 1rem var(--sans);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.finp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
.finp::placeholder{color:var(--ink5)}

.btn-signin{width:100%;margin-top:6px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:2px;cursor:pointer;font:700 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .15s}
.btn-signin:hover:not(:disabled){background:var(--accent2)}
.btn-signin:disabled{opacity:.55;cursor:not-allowed}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;display:none;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:2s}}

.card-foot{padding:13px 34px 15px;background:var(--bg2);border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-foot-link{font:600 12px var(--sans);color:var(--ink3);display:inline-flex;align-items:center;gap:6px}
.card-foot-link:hover{color:var(--accent)}
.card-secure{display:flex;align-items:center;gap:6px;font:500 12px var(--sans);color:var(--ink4)}
.card-secure svg{width:13px;height:13px}
@media(max-width:480px){
  .card-body{padding:28px 20px 24px}
  .card-foot{padding:12px 20px 14px}
}
</style>
</head>
<body>

<div class="card">
  <div class="card-top-rule"></div>
  <div class="card-body">

    <div class="card-logo">
      <a href="/" class="logo-img-wrap">
        <img src="/images/tps.png" alt="The Pacific Signal">
        <span class="logo-name">The Pacific Signal</span>
      </a>
      <div class="logo-orn">
        <div class="logo-orn-line"></div>
        <div class="logo-orn-dia"></div>
        <div class="logo-orn-line"></div>
      </div>
      <div class="logo-tag">Beyond the Headlines</div>
    </div>

    <div class="card-divider"></div>
    <div class="card-subtitle">Editorial Administration</div>

    <div class="alert" id="alert"></div>

    <form onsubmit="return doLogin(event)">
      <div class="fg">
        <label class="flbl">Username</label>
        <input class="finp" type="text" id="uname" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="fg">
        <label class="flbl">Password</label>
        <input class="finp" type="password" id="pw" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-signin" id="loginBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnTxt">Sign In</span>
      </button>
    </form>

  </div>

  <div class="card-foot">
    <a href="/" class="card-foot-link">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
      Back to site
    </a>
    <div class="card-secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Secure access
    </div>
  </div>
</div>

<script>
if(localStorage.getItem('pacific_signal_token')){window.location.href='/admin.html'}

async function doLogin(e){
  e.preventDefault();
  var u=document.getElementById('uname').value.trim();
  var p=document.getElementById('pw').value;
  var al=document.getElementById('alert');
  var btn=document.getElementById('loginBtn');
  var sp=document.getElementById('spinner');
  var bt=document.getElementById('btnTxt');

  al.className='alert';
  btn.disabled=true;sp.style.display='block';bt.textContent='Authenticating\u2026';

  try{
    var r=await fetch('/api/admin/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})
    });
    var d=await r.json();
    if(!r.ok){
      al.className='alert on';al.textContent=d.error||'Invalid credentials. Please try again.';
      btn.disabled=false;sp.style.display='none';bt.textContent='Sign In';
      return false;
    }
    localStorage.setItem('pacific_signal_token',d.token);
    localStorage.setItem('pacific_signal_admin',JSON.stringify(d.admin));
    bt.textContent='Access Granted\u2026';
    setTimeout(function(){window.location.href='/admin.html'},380);
  }catch(err){
    al.className='alert on';al.textContent='Network error. Please check your connection.';
    btn.disabled=false;sp.style.display='none';bt.textContent='Sign In';
  }
  return false;
}
</script>
</body>
</html>
